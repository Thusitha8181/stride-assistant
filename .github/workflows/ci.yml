name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Server unit tests enforce the coverage gate (vitest thresholds).
      - run: npm run test:unit
      - run: npm run build

  integration:
    name: Integration tests (Qdrant via Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  evals:
    name: Agent evals (replayed cassettes, no API key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The local embedding model (~25 MB) is downloaded once, then cached.
      - uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-${{ hashFiles('apps/server/src/config.ts') }}
      # Replays recorded model responses through the real agent, tools and evaluators; fails on any gate.
      - run: npm run eval:mock

  # Added in later milestones (PRD §10.5): F-code coverage matrix, Playwright E2E.
